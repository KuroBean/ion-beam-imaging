# Phase 2 agent loop settings (plan_phase2.md sections 3, 5.1, 11).
# Loaded separately from the Phase 1 config files, so Phase 1 config hashes are unchanged.
# Values marked DEV are placeholders for development runs; the author sets the evaluation values
# after the per-round solve and LLM costs are measured (author 2026-11-14).

claude:
  executable: claude          # headless Claude Code (`claude -p`); the only LLM entry point (agents/llm.py)
  restricted: true            # --restricted: ignore user/project/local settings, confine file tools to the cwd
  strict_mcp_config: true     # --strict-mcp-config with no --mcp-config: no MCP servers
  max_retries: 2              # re-ask with the validation error appended, then raise

roles:                        # full model IDs are pinned (no aliases), so a run can be reproduced
  planner:
    model: claude-opus-5-5
    effort: high
    tools: []                 # no tools: everything it needs is in the prompt
    timeout_s: 900
  critic:
    model: claude-opus-5-5
    effort: high
    tools: [Read]             # Read inside the round's evidence folder only (plots, metrics)
    timeout_s: 900
  editor:
    model: claude-opus-5-5
    effort: high
    tools: [Read, Write, Edit]   # no shell: the loop builds and checks the variant itself
    permission_mode: acceptEdits # file edits auto-accepted; --restricted confines them to the edit's sandbox
    timeout_s: 1800

loop:
  round_cap: 8                # DEV
  solve_budget: 200           # DEV: total solves (optimizer trials, editor smoke tests, 3D promotions)
  study_budget_min: 10        # DEV: smallest optimizer study the planner may ask for
  study_budget_max: 60        # DEV: largest
  no_improvement_rounds: 3    # stop after this many rounds without improving the best score by more than...
  improvement_tol_deg: 0.01   # ...this much (score = worst-case dtheta, deg, lower is better)
  validator_retries: 2        # invalid proposals sent back to the planner before the loop stops
  editor_failure_cap: 2       # consecutive failed edits before the loop stops
  editor_attempts: 3          # editor calls per edit; each retry gets the failed check's message
  editor_build_timeout_s: 900 # building the variant's 2D model (build_axisym.py --solve --particles, ~1 min)
  min_bound_fraction: 0.1     # planner bounds must span at least this fraction of the constraint range
  warm_start_top_k: 3         # best earlier trials of the same configuration enqueued in a new study
