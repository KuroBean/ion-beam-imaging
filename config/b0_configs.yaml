# Fixed configuration list for baseline B0 (plan 9.10). The author writes the real
# hand-designed templates; the entries below are EXAMPLES.
# wiring: tip and electrodes e1..e9 (= L1..L9) -> LV1..LV4 or GND; anything not listed is GND.
# HV roles are fixed. Deflectors are grounded in Phase 1.

configurations:
  - config_id: example_extractor_only
    description: "EXAMPLE: positive tip, whole stack grounded (drift)"
    cfg: 1
    wiring: {tip: LV1}

  - config_id: example_einzel
    description: "EXAMPLE: positive tip, Einzel lens on E2..E4 (E3 on LV2), rest grounded"
    cfg: 1
    wiring: {tip: LV1, e3: LV2}

  - config_id: example_einzel_accel
    description: "EXAMPLE (plan 7.2): Einzel lens + accelerating stage on E7, E8"
    cfg: 1
    wiring: {tip: LV1, e3: LV2, e7: LV3, e8: LV3}

  # ---- cfg 3 (chambers joined; the 2D model's stored geometry). DRAFTS by Claude 2026-11-14 from the
  # 2D voltage searches (logs/study_2d_search_meniscus.json); the author replaces them with the real
  # templates (plan 9.10). Each tests one idea; channels not listed are grounded.
  - config_id: c3_extractor
    description: "DRAFT: positive tip + extractor E1, rest of the stack grounded"
    cfg: 3
    wiring: {tip: LV1, e1: LV2}

  - config_id: c3_einzel
    description: "DRAFT: tip, E1, Einzel lens with E3 as the centre (E2, E4 grounded)"
    cfg: 3
    wiring: {tip: LV1, e1: LV2, e3: LV3}

  - config_id: c3_einzel_split
    description: "DRAFT: tip, E1, E3 centre, E2+E4 on their own channel (the 2D search wiring, up to 96% on the MCP)"
    cfg: 3
    wiring: {tip: LV1, e1: LV2, e3: LV3, e2: LV4, e4: LV4}

  - config_id: c3_einzel_accel
    description: "DRAFT: tip, E1, Einzel centre E3, accelerating stage E7+E8"
    cfg: 3
    wiring: {tip: LV1, e1: LV2, e3: LV3, e7: LV4, e8: LV4}

  - config_id: c3_grounded_tip
    description: "DRAFT: grounded tip, negative extractor E1, Einzel centre E3, E2+E4"
    cfg: 3
    wiring: {e1: LV1, e3: LV2, e2: LV3, e4: LV3}
