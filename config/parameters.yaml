# Parameter registry (plan section 7.1). Every COMSOL parameter the code may set is
# declared here; nothing outside the registry gets set. Bounds are NOT stored here,
# they come from constraints.yaml.
#
# Fields: name (code name), comsol_name (global parameter name in BOTH models; null =
# not modelled), type (float | int | bool, default float), unit (unit the value is written
# to COMSOL with), allowed (optional list of allowed values), per_electrode (true =
# template expanded for k = 1..constraints.electrodes.count; use {k} in name and
# comsol_name).
#
# comsol_name values confirmed by introspection (docs/comsol_api_notes.md, 2026-11-10).
# Model status: 2D (build_axisym.py) has all of them. 3D v5 lacks mesh_gap (author adds it
# in the GUI) and v_tip (scripted, new file); the worker refuses jobs that need a
# parameter the loaded model does not have.

parameters:
  - name: cfg
    comsol_name: cfg
    type: int
    allowed: [1, 2, 3]
    description: "chamber setup: 1 = chamber 1 (tube), 2 = chamber 2 (sphere), 3 = both joined"
  - name: z_mcp
    comsol_name: z_mcp_c1      # free only in cfg 1; for cfg 2/3 mcp_z is fixed (sphere centre) and the
    unit: mm                   # worker checks the job's z_mcp against the model instead of setting it
    description: MCP front face position (plan coordinates; the adapter writes z_mcp + tip_z)
  - name: mesh_gap
    comsol_name: mesh_gap
    unit: mm
    description: mesh plane distance in front of the MCP face (mesh rides on the MCP holder)
  - name: lens_gap
    comsol_name: lens_gap
    unit: mm
    description: tip apex to the E1 (L1) front face; places the whole fixed stack
  - name: v_tip
    comsol_name: v_tip
    unit: V
    description: tip (needle) potential
  - name: v_mesh
    comsol_name: V_screen
    unit: V
    description: mesh potential (HV4); the 2D/3D screen cross is held at the same potential
  - name: v_mcp_front
    comsol_name: V_mcp_front
    unit: V
    description: MCP front potential (HV1)
  - name: v_mcp_back
    comsol_name: V_mcp_back
    unit: V
    description: MCP back potential (HV2), from mcp_back_offset_V
  - name: v_phosphor
    comsol_name: null          # not modelled (no phosphor screen in either model)
    unit: V
    description: phosphor potential (HV3), from phosphor_offset_V
  - name: v_e{k}
    comsol_name: L{k}_v
    unit: V
    per_electrode: true
    description: potential of electrode k (L k), set from the wiring map
  - name: v_d1a
    comsol_name: D1a_v
    unit: V
    description: deflector 1 half a (2D uses the mean of a and b)
  - name: v_d1b
    comsol_name: D1b_v
    unit: V
    description: deflector 1 half b
  - name: v_d2a
    comsol_name: D2a_v
    unit: V
    description: deflector 2 half a
  - name: v_d2b
    comsol_name: D2b_v
    unit: V
    description: deflector 2 half b
  - name: ion_mass
    comsol_name: m_ion
    unit: kg
    description: particle mass, from spec.launch.mass_Da
  - name: ion_charge
    comsol_name: Z_ion
    type: int
    description: charge number (signed), from spec.launch.charge
  - name: t_end
    comsol_name: t_end
    unit: us
    description: particle tracing end time, from spec.launch.t_end_us
  - name: dt_out
    comsol_name: dt_out
    unit: us
    description: particle output interval, t_end / backend.worker.output_steps
